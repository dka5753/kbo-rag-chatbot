name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (가짜 LLM/임베딩으로 외부 의존 없이 실행)
        run: pytest -q

  test-postgres:
    # 워커 작업 선점 로직이 Postgres에서도 동작하는지 확인
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kbo
          POSTGRES_PASSWORD: kbo
          POSTGRES_DB: kbo
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kbo" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kbo:kbo@localhost:5432/kbo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_api_worker.py

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kbo-rag-chatbot:ci .

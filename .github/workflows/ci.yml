name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
      - name: Install (uv.lock 과 다르면 실패)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Test (가짜 LLM/임베딩으로 외부 의존 없이 실행)
        run: uv run pytest -q

  test-postgres:
    # 워커 작업 선점·장애 복구 로직이 Postgres에서도 동작하는지 확인
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kbo
          POSTGRES_PASSWORD: kbo
          POSTGRES_DB: kbo
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kbo" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kbo:kbo@localhost:5432/kbo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
      - name: Install (uv.lock 과 다르면 실패)
        run: uv sync --locked
      - run: uv run pytest -q tests/test_api_worker.py

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kbo-rag-chatbot:ci .
